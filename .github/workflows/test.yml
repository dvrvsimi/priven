name: Test

on:
  push:
    branches: [main, priven-v2]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: 1.18.17
  ANCHOR_VERSION: 0.30.1
  NODE_VERSION: 18

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client
        run: cd client && yarn build

      - name: Build program
        run: anchor build

      - name: Check program size
        run: |
          ls -la target/deploy/*.so
          size=$(stat -c%s target/deploy/priven.so)
          if [ $size -gt 200000 ]; then
            echo "Program size: $size bytes"
          else
            echo "Program size OK: $size bytes"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint client
        run: cd client && yarn lint || true

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings || true

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup test keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Build and test
        run: anchor test --skip-deploy
        env:
          ANCHOR_WALLET: ~/.config/solana/id.json
