[package]
name = "priven-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "priven"
path = "src/main.rs"

[dependencies]
solana-sdk = "3.0"
solana-client = "3.0"
solana-program = "3.0"

anchor-lang = "0.32"
anchor-client = "0.32"

# Arcium
arcium-client = "0.6.3"

# Cryptography
x25519-dalek = "2.0"  
curve25519-dalek = "4.1"
sha2 = "0.10"  

wincode = "0.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI utilities
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["full", "rt-multi-thread"] }

anyhow = "1.0"
thiserror = "2.0"

env_logger = "0.11"
log = "0.4"

# Progress indicators
indicatif = "0.17"
