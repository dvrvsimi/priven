[package]
name = "priven-proxy"
version = "0.1.0"
edition = "2021"
description = "Privacy-preserving RPC proxy for Solana"
license = "MIT"

[dependencies]
# Web framework (latest stable)
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.49", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Cryptography (latest stable, compatible versions)
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Solana base58 only - no full SDK to avoid dep conflicts
bs58 = "0.5"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
